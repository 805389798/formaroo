name: Backup Supabase

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 2:00
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          if [ -n "$DB_URL" ]; then
            curl -sS -m 120 "$DB_URL" -o "backups/db_$(date +%Y%m%d).sql" || echo "dump failed (may need pg_dump)" > backups/FAILED.txt
          else
            echo "SUPABASE_DB_URL secret not set" > backups/NOT_CONFIGURED.txt
          fi

      - name: Commit backup
        run: |
          git config user.name "Yearn05 Backup Bot"
          git config user.email "backup@formaroo.com"
          git add backups/ || true
          git commit -m "daily backup $(date +%Y%m%d)" || echo "no changes to commit"
          git push origin main || echo "push failed (no token or no changes)"
